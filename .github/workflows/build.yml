name: build

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_AUTO_PIN: 0

    strategy:
      matrix:
        node-version: [22.x, 23.x, 24.x, 25.x, 26.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - run: pnpm install
      - run: pnpm run lint # support node 22+ only
      - run: pnpm run fmt # support node 22+ only
      - run: pnpm run test
